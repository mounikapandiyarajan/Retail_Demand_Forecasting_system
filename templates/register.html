{% extends "base.html" %}


{% block title %}

Register | Retail Demand Forecasting System

{% endblock %}


{% block content %}


<div class="auth-page">


    <div class="glass-card register-card">


        <!-- LOGO -->

        <div class="logo-container">

            <div class="logo">

                <i class="bi bi-person-plus"></i>

            </div>

        </div>


        <h1 class="auth-title">

            Create Account

        </h1>


        <p class="auth-subtitle">

            Create your account to access the system.

        </p>


        <!-- REGISTER FORM -->

        <form
            method="POST"
            action="{{ url_for('register') }}"
        >


            <!-- NAME -->

            <div class="form-group">

                <label>

                    Full Name

                </label>


                <div class="input-wrapper">

                    <i class="bi bi-person"></i>


                    <input
                        type="text"
                        name="name"
                        class="form-control-custom"
                        placeholder="Enter your name"
                        required
                    >

                </div>

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label>

                    Email Address

                </label>


                <div class="input-wrapper">

                    <i class="bi bi-envelope"></i>


                    <input
                        type="email"
                        name="email"
                        class="form-control-custom"
                        placeholder="Enter your email"
                        required
                    >

                </div>

            </div>


            <!-- ROLE -->

            <div class="form-group">

                <label>

                    Select Role

                </label>


                <div class="input-wrapper">

                    <i class="bi bi-briefcase"></i>


                    <select
                        name="role"
                        class="form-control-custom"
                        required
                    >

                        <option value="Admin">

                            Admin

                        </option>


                        <option value="Inventory Manager">

                            Inventory Manager

                        </option>


                        <option
                            value="Business Analyst"
                            selected
                        >

                            Business Analyst

                        </option>

                    </select>

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label>

                    Password

                </label>


                <div class="input-wrapper">

                    <i class="bi bi-lock"></i>


                    <input
                        type="password"
                        name="password"
                        class="form-control-custom"
                        placeholder="Create password"
                        required
                    >

                </div>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label>

                    Confirm Password

                </label>


                <div class="input-wrapper">

                    <i class="bi bi-shield-lock"></i>


                    <input
                        type="password"
                        name="confirm_password"
                        class="form-control-custom"
                        placeholder="Confirm password"
                        required
                    >

                </div>

            </div>


            <!-- BUTTON -->

            <button
                type="submit"
                class="login-button"
            >

                <i class="bi bi-person-check"></i>

                Create Account

            </button>


        </form>


        <div class="register-section">

            Already have an account?

            <a
                href="{{ url_for('login') }}"
            >

                Login

            </a>

        </div>


    </div>

</div>


{% endblock %}
